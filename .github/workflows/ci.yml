name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the baseline in vcpkg-configuration.json.
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d

jobs:
  compliance:
    name: Compliance (no dumps, no binaries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scanner self-test
        run: python3 -m unittest discover -s tests/compliance -p "test_*.py"

      - name: Scan the tree
        run: python3 tests/compliance/check_repo.py

      # Also scan every commit being added, so a dump that was committed and then
      # deleted in a later commit still fails: it would remain in history.
      # On a push the range is before..after, unless the push was forced, created the
      # branch, or its "before" commit is not in this checkout (a force-push after a rebase
      # leaves the old head out). Then it scans everything the branch adds over main.
      - name: Scan new commits
        shell: bash
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.forced }}" != "true" ] && [ -n "$before" ] && ! [[ "$before" =~ ^0+$ ]] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
            range="$before..$after"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # main has no base to compare against: scan its whole history.
            range="$after"
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            range="origin/main..$after"
          fi
          echo "Scanning commits: $range"
          python3 tests/compliance/check_repo.py --commits "$range"

  build:
    name: Build and test (${{ matrix.os }})
    needs: compliance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            preset: ci-windows
          - os: ubuntu-24.04
            preset: ci-linux
    runs-on: ${{ matrix.os }}
    env:
      # Not VCPKG_ROOT: msvc-dev-cmd points that at Visual Studio's bundled vcpkg.
      MPT_VCPKG_DIR: ${{ github.workspace }}/../vcpkg
      # VCPKG_DEFAULT_BINARY_CACHE is set in a step below: it must not contain '..'.
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang: runtimes/gc_wii is built with Clang on every platform (ADR 0008 rule 4).
          # llvm: unversioned llvm-nm, llvm-objcopy and llvm-ar for the MP4 REL tools and link checks.
          # lld: shared objects at the MP4 module's fixed image base (--image-base, mp4/layout.cmake).
          sudo apt-get install -y clang llvm lld ninja-build pkg-config autoconf automake libtool \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Logged so a runner image update that changes the Clang version is visible next to
      # any golden-trail mismatch. Linux fails here if clang is missing; on Windows the
      # SDK's CMake also searches the Visual Studio and LLVM install directories.
      - name: Show the Clang toolchain
        shell: bash
        run: |
          # Ninja is the presets' generator. On Windows it comes from Visual Studio's CMake
          # component, which msvc-dev-cmd puts on PATH; fail here, by name, if an image drops it.
          cmake --version | head -n 1
          echo "ninja $(ninja --version)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            if command -v clang-cl >/dev/null 2>&1; then clang-cl --version; else echo "clang-cl is not on PATH"; fi
          else
            clang --version
            clang++ --version
            llvm-nm --version
            ld.lld --version
          fi

      # actions/cache rejects a path with '.' or '..' in it ("Invalid pattern"), so a cache path
      # under github.workspace/.. was never saved and every run rebuilt every port from source,
      # downloading each one from GitHub. RUNNER_TEMP is absolute and the same on both Linux jobs,
      # which matters: the mp4-module job's restore only matches a cache saved with the same path.
      - name: Set the vcpkg binary cache path
        shell: bash
        run: echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-

      # Retries network failures. Runs after msvc-dev-cmd, so the VCPKG_ROOT it writes overrides
      # the VS-bundled vcpkg for the steps below.
      - name: Bootstrap vcpkg
        shell: bash
        run: bash .github/scripts/bootstrap-vcpkg.sh

      # GX layer inputs (P1-21, E10): the verified aurora checkout and a headers-only Dawn
      # prefix, so the null GX build, its scenes and the MTX goldens run under -Werror on both
      # OSes (runtimes/gc_wii/gx/README.md). Windows keeps them on a short path: Dawn's and
      # aurora's paths are long, and some MSVC tools stop at 260 characters. Linux uses RUNNER_TEMP:
      # actions/cache does not save a path with '..' in it, as with the vcpkg binary cache above.
      - name: Set the GX source and Dawn paths
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then root="C:/mpt"; else root="$RUNNER_TEMP/mpt-gx"; fi
          mkdir -p "$root"
          echo "MPT_GX_SOURCES=$root/s" >> "$GITHUB_ENV"
          echo "MPT_GX_DAWN=$root/dawn" >> "$GITHUB_ENV"

      # A first configure without the GX inputs: it builds the source fetcher, which needs
      # asset-import from the root project. GX is reported unavailable here, not an error.
      # This configure runs vcpkg install, which downloads port sources and patches from GitHub,
      # so it is retried once after a pause. Ports built before a failure are already in the
      # binary cache, so the retry does not rebuild them. A vcpkg install failure inside the
      # toolchain file also makes CMake report that it cannot find "Ninja"; that message is a
      # consequence, not the cause (run 42568270791). "Show the Clang toolchain" checks Ninja itself.
      - name: Configure (to build the source fetcher)
        id: configure-fetcher
        continue-on-error: true
        run: cmake --preset ${{ matrix.preset }}

      # `sleep` is also a PowerShell alias, so this line runs in both default shells.
      - name: Configure (to build the source fetcher), retry
        if: ${{ steps.configure-fetcher.outcome == 'failure' }}
        run: sleep 60; cmake --preset ${{ matrix.preset }}

      - name: Build the source fetcher
        run: cmake --build --preset ${{ matrix.preset }} --target mpt_fetch_sources

      - name: Restore the verified aurora checkout
        uses: actions/cache@v5
        with:
          path: ${{ env.MPT_GX_SOURCES }}/aurora
          key: gx-aurora-${{ matrix.os }}-${{ hashFiles('runtimes/gc_wii/gx/aurora.lock') }}

      # Runs on a cache hit too: the fetcher re-verifies the cached checkout's commit and tree.
      - name: Fetch and verify aurora (aurora.lock)
        shell: bash
        run: |
          tool="build/${{ matrix.preset }}/runtimes/gc_wii/gx/tools/mpt_fetch_sources"
          [ -f "$tool.exe" ] && tool="$tool.exe"
          "$tool" --lock runtimes/gc_wii/gx/aurora.lock --cache "$MPT_GX_SOURCES"

      - name: Restore the verified musyx checkout
        uses: actions/cache@v5
        with:
          path: ${{ env.MPT_GX_SOURCES }}/musyx
          key: gc-musyx-${{ matrix.os }}-${{ hashFiles('runtimes/gc_wii/mp4/decomp.lock') }}

      # MusyX only (ADR 0009, amendment after P1-13b). decomp.lock also pins Party Board, the
      # MP4 game source, which public CI does not download. The fetcher reads a lock holding
      # just the musyx entry, derived from decomp.lock here so the pin stays in one place, and
      # verifies its commit and tree (also on a cache hit).
      - name: Fetch and verify musyx (decomp.lock, musyx only)
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          lock="$RUNNER_TEMP/musyx.lock"
          "$py" - runtimes/gc_wii/mp4/decomp.lock "$lock" <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          lock["sources"] = [s for s in lock["sources"] if s["name"] == "musyx"]
          if len(lock["sources"]) != 1:
              sys.exit("decomp.lock has no single musyx entry")
          json.dump(lock, open(sys.argv[2], "w", encoding="utf-8"), indent=2)
          PY
          tool="build/${{ matrix.preset }}/runtimes/gc_wii/gx/tools/mpt_fetch_sources"
          [ -f "$tool.exe" ] && tool="$tool.exe"
          "$tool" --lock "$lock" --cache "$MPT_GX_SOURCES"

      - name: Restore the headers-only Dawn prefix
        id: dawn-headers
        uses: actions/cache@v5
        with:
          path: ${{ env.MPT_GX_DAWN }}
          key: gx-dawn-headers-${{ matrix.os }}-${{ hashFiles('runtimes/gc_wii/gx/dawn.lock', 'runtimes/gc_wii/gx/tools/build_dawn.cmake') }}

      # Only the generated WebGPU headers: seconds of work after the verified fetch, no compile.
      # Dawn's sources are fetched only on a cache miss and are not cached themselves.
      - name: Make the headers-only Dawn prefix (dawn.lock)
        if: ${{ steps.dawn-headers.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          tool="$PWD/build/${{ matrix.preset }}/runtimes/gc_wii/gx/tools/mpt_fetch_sources"
          [ -f "$tool.exe" ] && tool="$tool.exe"
          cmake "-DMPT_FETCH_TOOL=$tool" "-DMPT_SOURCE_CACHE=$MPT_GX_SOURCES" "-DMPT_DAWN_PREFIX=$MPT_GX_DAWN" \
                -DMPT_DAWN_HEADERS_ONLY=ON -P runtimes/gc_wii/gx/tools/build_dawn.cmake

      # MPT_REQUIRE_GC_WII, MPT_REQUIRE_GX and MPT_REQUIRE_MUSYX: a missing Clang, aurora or
      # musyx checkout, or Dawn prefix fails the configure instead of silently skipping the
      # layer (P1-21, E10).
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }} -DMPT_REQUIRE_GC_WII=ON -DMPT_REQUIRE_GX=ON -DMPT_REQUIRE_MUSYX=ON
          "-DMPT_SOURCE_CACHE=${{ env.MPT_GX_SOURCES }}" "-DMPT_DAWN_PREFIX=${{ env.MPT_GX_DAWN }}"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # MP4 game module, compile-only (ADR 0009, Consequences; M4-12). Builds mp4_game from the pins
  # in runtimes/gc_wii/mp4/decomp.lock with no dump: no artifacts are kept or uploaded, and no test
  # that loads or runs the module is executed (mp4_game_abi is excluded below). A separate job, so
  # a module compile failure does not hide the main build's result.
  # Every cache step here is restore-only: this job never saves a cache, so nothing it fetches
  # (Party Board in particular) or builds is ever cached.
  # continue-on-error until the first Linux build of mp4_game is green; then remove it so the job
  # becomes required.
  mp4-module:
    name: MP4 game module, compile-only (ubuntu-24.04)
    needs: compliance
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    env:
      MPT_VCPKG_DIR: ${{ github.workspace }}/../vcpkg
      # VCPKG_DEFAULT_BINARY_CACHE is set in a step below, as in the build job.
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # Same set as the build job: clang for runtimes/gc_wii (ADR 0008 rule 4), llvm for the
          # MP4 REL tools and link checks, lld for the module's fixed image base.
          sudo apt-get install -y clang llvm lld ninja-build pkg-config autoconf automake libtool \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Show the Clang toolchain
        run: |
          clang --version
          clang++ --version
          llvm-nm --version
          ld.lld --version

      # Must be the build job's path exactly: a cache restores only with the path it was saved with.
      - name: Set the vcpkg binary cache path
        run: echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      # Restore-only: the build job owns saving this cache.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-ubuntu-24.04-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-ubuntu-24.04-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: bash .github/scripts/bootstrap-vcpkg.sh

      # The build job's Linux path, so the headers-only Dawn prefix it saves restores here.
      - name: Set the GX source and Dawn paths
        run: |
          root="$RUNNER_TEMP/mpt-gx"
          mkdir -p "$root"
          echo "MPT_GX_SOURCES=$root/s" >> "$GITHUB_ENV"
          echo "MPT_GX_DAWN=$root/dawn" >> "$GITHUB_ENV"

      # Retried once, as in the build job: vcpkg install downloads from GitHub.
      - name: Configure (to build the source fetcher)
        id: configure-fetcher
        continue-on-error: true
        run: cmake --preset ci-linux

      - name: Configure (to build the source fetcher), retry
        if: ${{ steps.configure-fetcher.outcome == 'failure' }}
        run: sleep 60; cmake --preset ci-linux

      - name: Build the source fetcher
        run: cmake --build --preset ci-linux --target mpt_fetch_sources

      # Fetched fresh every run (no cache): aurora, then the full decomp.lock (Party Board, MusyX
      # and aurora). The fetcher verifies each commit and tree.
      - name: Fetch and verify aurora (aurora.lock)
        run: build/ci-linux/runtimes/gc_wii/gx/tools/mpt_fetch_sources --lock runtimes/gc_wii/gx/aurora.lock --cache "$MPT_GX_SOURCES"

      - name: Fetch and verify Party Board, MusyX and aurora (decomp.lock)
        run: build/ci-linux/runtimes/gc_wii/gx/tools/mpt_fetch_sources --lock runtimes/gc_wii/mp4/decomp.lock --cache "$MPT_GX_SOURCES"

      # Restore-only: the build job owns saving this cache. It holds only generated WebGPU headers.
      - name: Restore the headers-only Dawn prefix
        id: dawn-headers
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.MPT_GX_DAWN }}
          key: gx-dawn-headers-ubuntu-24.04-${{ hashFiles('runtimes/gc_wii/gx/dawn.lock', 'runtimes/gc_wii/gx/tools/build_dawn.cmake') }}

      - name: Make the headers-only Dawn prefix (dawn.lock)
        if: ${{ steps.dawn-headers.outputs.cache-hit != 'true' }}
        run: |
          tool="$PWD/build/ci-linux/runtimes/gc_wii/gx/tools/mpt_fetch_sources"
          cmake "-DMPT_FETCH_TOOL=$tool" "-DMPT_SOURCE_CACHE=$MPT_GX_SOURCES" "-DMPT_DAWN_PREFIX=$MPT_GX_DAWN" \
                -DMPT_DAWN_HEADERS_ONLY=ON -P runtimes/gc_wii/gx/tools/build_dawn.cmake

      - name: Configure (MP4 game module ON)
        run: >-
          cmake --preset ci-linux -DMPT_REQUIRE_GX=ON -DMPT_REQUIRE_MUSYX=ON -DMPT_BUILD_MP4_GAME_MODULE=ON
          "-DMPT_SOURCE_CACHE=${{ env.MPT_GX_SOURCES }}" "-DMPT_DAWN_PREFIX=${{ env.MPT_GX_DAWN }}"

      # Only the Clang sub-build (runtimes/gc_wii), which holds mp4_game and its tests.
      - name: Build the GC/Wii layer and the MP4 game module
        run: cmake --build --preset ci-linux --target mpt_gc_wii_clang

      # The Clang sub-build's tests only, without mp4_game_abi: it loads and calls the module,
      # which ADR 0009 does not allow in public CI. Not the root ctest: its gc_wii_sdk test runs
      # this whole suite unfiltered, mp4_game_abi included.
      - name: Test (module not loaded)
        run: ctest --test-dir build/ci-linux/runtimes/gc_wii/clang -E '^mp4_game_abi$' --output-on-failure --no-tests=error
